plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ImGui Java
    implementation "io.github.spair:imgui-java-binding:1.87.7"
    implementation "io.github.spair:imgui-java-lwjgl3:1.87.7"
    implementation "io.github.spair:imgui-java-natives-windows:1.87.7"
    implementation "io.github.spair:imgui-java-natives-linux:1.87.7"
    implementation "io.github.spair:imgui-java-natives-macos:1.87.7"

    include "io.github.spair:imgui-java-binding:1.87.7"
    include "io.github.spair:imgui-java-lwjgl3:1.87.7"
    include "io.github.spair:imgui-java-natives-windows:1.87.7"
    include "io.github.spair:imgui-java-natives-linux:1.87.7"
    include "io.github.spair:imgui-java-natives-macos:1.87.7"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
